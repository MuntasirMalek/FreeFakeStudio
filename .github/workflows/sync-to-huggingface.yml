name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push https://MuntasirUtsho:$HF_TOKEN@huggingface.co/spaces/MuntasirUtsho/FreeFakeStudio main:main --force
          else
            echo "HF_TOKEN secret is not set. Skipping sync."
          fi
