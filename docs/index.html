<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeFakeStudio — Free AI Image Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="brand-icon">🎭</span>
        <div class="brand-text">
          <h1>FreeFakeStudio</h1>
        </div>
      </div>
      <div class="nav-actions">
        <div id="connection-status" class="status-pill status-disconnected">
          <span class="status-dot"></span>
          <span id="status-text">Disconnected</span>
        </div>
        <button id="disconnect-btn" class="btn btn-sm btn-ghost hidden">Disconnect</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- State 1: Launcher with Model Checkboxes -->
    <section id="launcher-view" class="view active">
      <div class="minimal-launcher">
        <h2 class="minimal-title">Create AI Art for Free</h2>
        
        <div class="launcher-box">
          <div class="models-header">
            <label class="models-label">Select Models (pick 1 or multiple):</label>
            <div class="quick-select-btns">
              <button type="button" id="select-fast-btn" class="pill-btn active">⚡ Fast Only <span class="rec-badge">Recommended</span></button>
              <button type="button" id="select-all-btn" class="pill-btn">✨ Select All</button>
            </div>
          </div>

          <div class="models-grid">
            <label class="model-checkbox-item">
              <input type="checkbox" name="model" value="⚡ Z-Image Turbo" checked>
              <span class="checkmark"></span>
              <div class="model-info">
                <strong>⚡ Z-Image Turbo</strong>
                <small>Fastest generation (8 steps, ~1 min)</small>
              </div>
            </label>

            <label class="model-checkbox-item">
              <input type="checkbox" name="model" value="🌊 FLUX.2-klein 4B">
              <span class="checkmark"></span>
              <div class="model-info">
                <strong>🌊 FLUX.2-klein 4B</strong>
                <small>Photorealistic &amp; general purpose</small>
              </div>
            </label>

            <label class="model-checkbox-item">
              <input type="checkbox" name="model" value="🔮 FLUX.2-klein 9B">
              <span class="checkmark"></span>
              <div class="model-info">
                <strong>🔮 FLUX.2-klein 9B</strong>
                <small>Maximum high-res detail</small>
              </div>
            </label>

            <label class="model-checkbox-item">
              <input type="checkbox" name="model" value="🎨 Qwen-Image-Edit">
              <span class="checkmark"></span>
              <div class="model-info">
                <strong>🎨 Qwen-Image-Edit</strong>
                <small>Conversational image editing</small>
              </div>
            </label>

            <label class="model-checkbox-item">
              <input type="checkbox" name="model" value="🖌️ ERNIE-Image Turbo">
              <span class="checkmark"></span>
              <div class="model-info">
                <strong>🖌️ ERNIE-Image Turbo</strong>
                <small>Baidu turbo text-to-image</small>
              </div>
            </label>
          </div>

          <a id="colab-launch-btn" href="https://colab.research.google.com/github/MuntasirMalek/FreeFakeStudio/blob/main/FreeFakeStudio_1Click.ipynb" target="_blank" class="btn btn-primary btn-giant btn-pulse">
            <span>START FREE GPU</span>
          </a>
        </div>
      </div>
    </section>

    <!-- State 2: Studio View -->
    <section id="studio-view" class="view">
      <div class="studio-header">
        <div class="studio-info">
          <span id="backend-display" class="backend-url-badge">Connecting...</span>
        </div>
        <div class="studio-controls">
          <button id="open-newtab-btn" class="btn btn-sm btn-outline">↗ New Tab</button>
          <button id="switch-engine-btn" class="btn btn-sm btn-ghost">Change Models</button>
        </div>
      </div>

      <div class="studio-frame-container">
        <div id="frame-loading" class="frame-loader">
          <div class="spinner"></div>
          <p id="loader-status">Loading Studio...</p>
        </div>
        <iframe id="studio-iframe" class="studio-frame" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
