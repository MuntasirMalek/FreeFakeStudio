<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeFakeStudio — Free AI Image Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="brand-icon">🎭</span>
        <div class="brand-text">
          <h1>FreeFakeStudio</h1>
        </div>
      </div>
      <div class="nav-actions">
        <div id="connection-status" class="status-pill status-disconnected">
          <span class="status-dot"></span>
          <span id="status-text">Disconnected</span>
        </div>
        <button id="disconnect-btn" class="btn btn-sm btn-ghost hidden">Disconnect</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- State 1: Ultra Minimal Launcher -->
    <section id="launcher-view" class="view active">
      <div class="minimal-launcher">
        <h2 class="minimal-title">Create AI Art for Free</h2>
        
        <div class="launcher-box">
          <div class="form-group">
            <label for="model-selector">Choose Model</label>
            <select id="model-selector" class="select-input">
              <option value="z_image" selected>⚡ Z-Image Turbo (Fastest ~1 min)</option>
              <option value="flux_4b">🌊 FLUX.2-klein 4B</option>
              <option value="flux_9b">🔮 FLUX.2-klein 9B</option>
              <option value="qwen">🎨 Qwen-Image-Edit</option>
              <option value="ernie">🖌️ ERNIE-Image Turbo</option>
            </select>
          </div>

          <a id="colab-launch-btn" href="https://colab.research.google.com/github/MuntasirMalek/FreeFakeStudio/blob/main/FreeFakeStudio_1Click.ipynb" target="_blank" class="btn btn-primary btn-giant btn-pulse">
            <span>🚀 START STUDIO ▶️</span>
          </a>

          <div class="quick-connect">
            <input type="url" id="manual-url" placeholder="Or paste gradio.live link here..." class="text-input text-input-sm">
            <button id="manual-connect-btn" class="btn btn-secondary btn-sm">Connect</button>
          </div>
        </div>
      </div>
    </section>

    <!-- State 2: Studio View -->
    <section id="studio-view" class="view">
      <div class="studio-header">
        <div class="studio-info">
          <span class="status-pill status-connected">
            <span class="status-dot"></span>
            <span>GPU Active</span>
          </span>
          <span id="backend-display" class="backend-url-badge">Connecting...</span>
        </div>
        <div class="studio-controls">
          <button id="open-newtab-btn" class="btn btn-sm btn-outline">↗ New Tab</button>
          <button id="switch-engine-btn" class="btn btn-sm btn-ghost">Change</button>
        </div>
      </div>

      <div class="studio-frame-container">
        <div id="frame-loading" class="frame-loader">
          <div class="spinner"></div>
          <p id="loader-status">Loading Studio...</p>
        </div>
        <iframe id="studio-iframe" class="studio-frame" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
